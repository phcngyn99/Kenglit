<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600">
  <rect width="760" height="600" fill="#F6F8F7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="66" font-size="30" font-weight="700" fill="#17372D">Install Kenglit</text>
    <text x="48" y="96" font-size="15" fill="#5E6D66">Drag Kenglit into Applications to install.</text>
    <text x="220" y="158" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#72847B">DRAG</text>
    <text x="540" y="158" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#72847B">DROP</text>
    <path d="M330 232H428M415 219 428 232 415 245" fill="none" stroke="#548D76" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 346H712" fill="none" stroke="#DBE4DE"/>
    <text x="48" y="382" font-size="17" font-weight="700" fill="#17372D">After copying</text>
    <circle cx="59" cy="410" r="11" fill="#E0F0E7"/>
    <text x="59" y="414" font-size="11" font-weight="700" text-anchor="middle" fill="#276C4E">1</text>
    <text x="82" y="415" font-size="14" fill="#344C40">Eject this disk.</text>
    <circle cx="59" cy="450" r="11" fill="#E0F0E7"/>
    <text x="59" y="454" font-size="11" font-weight="700" text-anchor="middle" fill="#276C4E">2</text>
    <text x="82" y="455" font-size="14" fill="#344C40">Open Kenglit from Applications.</text>
    <circle cx="59" cy="490" r="11" fill="#E0F0E7"/>
    <text x="59" y="494" font-size="11" font-weight="700" text-anchor="middle" fill="#276C4E">3</text>
    <text x="82" y="495" font-size="14" fill="#344C40">Menu bar → On.</text>
    <text x="48" y="536" font-size="12" fill="#5E6D66">First open (new Mac): Applications → right-click Kenglit → Open → Open</text>
    <text x="48" y="558" font-size="12" fill="#5E6D66">Or Privacy &amp; Security → Open Anyway. Needs English + Vietnamese keyboards.</text>
    <text x="48" y="585" font-size="10" fill="#7C8982">Kenglit · English for your apps. Vietnamese everywhere else.</text>
    <text x="712" y="585" font-size="10" text-anchor="end" fill="#7C8982">macOS 13+</text>
  </g>
</svg>
