<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600">
  <rect width="760" height="600" fill="#F6F8F7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="48" y="66" font-size="30" font-weight="700" fill="#17372D">Install Kenglit</text>
    <text x="48" y="96" font-size="15" fill="#5E6D66">Drag Kenglit into Applications, then open the installed app.</text>
    <text x="220" y="158" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#72847B">DRAG</text>
    <text x="540" y="158" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#72847B">DROP</text>
    <path d="M330 232H428M415 219 428 232 415 245" fill="none" stroke="#548D76" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 328H712" fill="none" stroke="#DBE4DE"/>
    <text x="48" y="366" font-size="17" font-weight="700" fill="#17372D">If macOS blocks the first launch</text>
    <text x="48" y="396" font-size="14" fill="#344C40">1. Open Kenglit from Applications once.</text>
    <text x="48" y="424" font-size="14" fill="#344C40">2. System Settings → Privacy &amp; Security → Open Anyway.</text>
    <text x="48" y="452" font-size="14" fill="#344C40">3. Confirm Open. Then choose On in Kenglit’s menu.</text>
    <text x="48" y="484" font-size="13" fill="#276C4E">Apple guide: support.apple.com/en-gb/102445</text>
    <text x="48" y="520" font-size="12" fill="#5E6D66">You can eject this disk after copying the app.</text>
    <text x="48" y="542" font-size="12" fill="#5E6D66">Add English + Vietnamese input sources in Keyboard settings.</text>
    <text x="48" y="566" font-size="11" fill="#65766C">Only approve a Kenglit build from a source you trust.</text>
    <text x="48" y="588" font-size="10" fill="#7C8982">Help: github.com/phcngyn99/Kenglit</text>
    <text x="712" y="588" font-size="10" text-anchor="end" fill="#7C8982">macOS 13+</text>
  </g>
</svg>
