<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600"><rect width="760" height="600" fill="#F6F8F7"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="66" font-size="30" font-weight="700" fill="#17372D">Install Kenglit</text>
<text x="48" y="96" font-size="15" fill="#5E6D66">Drag Kenglit into Applications, then open the installed app.</text>
<text x="220" y="158" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#72847B">DRAG</text>
<text x="540" y="158" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#72847B">DROP</text>
<path d="M330 232H428M415 219 428 232 415 245" fill="none" stroke="#548D76" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M48 328H712" fill="none" stroke="#DBE4DE"/>
<text x="48" y="366" font-size="17" font-weight="700" fill="#17372D">After copying</text>
<circle cx="59" cy="402" r="11" fill="#E0F0E7"/><text x="59" y="406" font-size="11" font-weight="700" text-anchor="middle" fill="#276C4E">1</text>
<text x="82" y="407" font-size="14" fill="#344C40">Eject this disk</text>
<text x="48" y="431" font-size="12" fill="#5E6D66">The app is now installed.</text>
<circle cx="291" cy="402" r="11" fill="#E0F0E7"/><text x="291" y="406" font-size="11" font-weight="700" text-anchor="middle" fill="#276C4E">2</text>
<text x="314" y="407" font-size="14" fill="#344C40">Open Kenglit</text>
<text x="280" y="431" font-size="12" fill="#5E6D66">From Applications.</text>
<circle cx="523" cy="402" r="11" fill="#E0F0E7"/><text x="523" y="406" font-size="11" font-weight="700" text-anchor="middle" fill="#276C4E">3</text>
<text x="546" y="407" font-size="14" fill="#344C40">Turn it On</text>
<text x="512" y="431" font-size="12" fill="#5E6D66">Use the menu-bar icon.</text>
<rect x="48" y="470" width="664" height="70" rx="10" fill="#E8F1EB"/>
<text x="64" y="498" font-size="14" font-weight="700" fill="#2C5944">English + Vietnamese</text>
<text x="64" y="522" font-size="12" fill="#4F6F5D">Enable both in System Settings → Keyboard → Text Input.</text><text x="48" y="584" font-size="10" fill="#7C8982">Help: github.com/phcngyn99/Kenglit</text>
<text x="712" y="584" font-size="10" text-anchor="end" fill="#7C8982">macOS 13+</text></g></svg>