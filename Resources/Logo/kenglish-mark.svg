<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="kenglish">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2F3A"/>
      <stop offset="100%" stop-color="#151820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3DDC97"/>
      <stop offset="100%" stop-color="#2BB0ED"/>
    </linearGradient>
  </defs>
  <!-- outer keycap body -->
  <rect x="14" y="18" width="100" height="92" rx="18" fill="url(#face)"/>
  <!-- key face raised -->
  <rect x="22" y="24" width="84" height="72" rx="12" fill="#1C212B"/>
  <!-- top highlight rim -->
  <path d="M34 28h60a8 8 0 0 1 8 8v2H26v-2a8 8 0 0 1 8-8z" fill="#3A4150" opacity="0.55"/>
  <!-- EN letters -->
  <text x="64" y="72" text-anchor="middle" font-family="SF Pro Rounded, Helvetica Neue, Arial, sans-serif"
        font-size="42" font-weight="700" letter-spacing="-1.5" fill="#F4F7FA">EN</text>
  <!-- bottom status bar (force active) -->
  <rect x="36" y="92" width="56" height="8" rx="4" fill="url(#accent)"/>
</svg>
